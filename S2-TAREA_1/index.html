<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulario de Registro</title>
  <!-- Sesión 2: enlace a la hoja de estilos -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <div class="card__header">
      <div class="logo">✦</div>
      <h1>Crear cuenta</h1>
      <p>Completa los campos para registrarte</p>
    </div>

    <!-- Formulario de registro – Sesión 1 -->
    <form id="registroForm" novalidate>

      <!-- Campo: Nombre -->
      <div class="form-group">
        <label for="nombre">Nombre completo</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          placeholder="Ej. María García"
          autocomplete="name"
        />
        <span class="error-msg" id="error-nombre"></span>
      </div>

      <!-- Campo: Correo -->
      <div class="form-group">
        <label for="correo">Correo electrónico</label>
        <input
          type="email"
          id="correo"
          name="correo"
          placeholder="ejemplo@correo.com"
          autocomplete="email"
        />
        <span class="error-msg" id="error-correo"></span>
      </div>

      <!-- Campo: Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Mínimo 8 caracteres"
            autocomplete="new-password"
          />
          <button type="button" id="togglePassword" aria-label="Mostrar contraseña">👁</button>
        </div>
        <span class="error-msg" id="error-password"></span>
      </div>

      <button type="submit" class="btn-submit">Registrarse</button>

    </form>

    <p class="footer-text">¿Ya tienes cuenta? <a href="#">Inicia sesión</a></p>
  </div>

  <!-- Sesión 3: enlace al script de validaciones -->
  <script src="script.js"></script>
</body>
</html>
